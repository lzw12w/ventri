# Workspace root (not a distribution). Members live in packages/*; see DESIGN.md section 7.
[project]
name = "ventri-workspace"
version = "0.2.0a1"
requires-python = ">=3.12"
dependencies = ["ventri", "ventri-std", "ventri-agent"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "pydantic>=2.7",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "lark-oapi>=1.7,<2",   # the Feishu channel's SDK-contract tests (ventri-agent[feishu])
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ventri = { workspace = true }
ventri-std = { workspace = true }
ventri-agent = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` run straight from a checkout even without `uv sync`.
pythonpath = [".", "packages/ventri/src", "packages/ventri-std/src", "packages/ventri-agent/src",
              "integrations/harbor"]
markers = ["live: calls the real DeepSeek API (runs only when DEEPSEEK_API_KEY is set; small budget)"]

[tool.pyright]
extraPaths = ["integrations/harbor"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["docs/build"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "BLE001", "ASYNC115"]
"benchmarks/**" = ["S101", "T201"]
"examples/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["ventri", "ventri_std", "ventri_agent"]
