[project]
name = "ventri"
version = "0.1.0"
description = "cordis-inspired plugin kernel with structured concurrency and transactional plugin changes"
requires-python = ">=3.11"
dependencies = ["anyio>=4.4"]

[project.optional-dependencies]
test = ["pytest>=8", "trio>=0.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ventri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
